url: https://raydonal.github.io/logcumulant/

template:
  bootstrap: 5
  bslib:
    primary: "#377EB8"

home:
  title: Goodness-of-Fit Tests Based on Mellin Log-Cumulants
  description: >
    Hotelling-type T-squared goodness-of-fit tests and diagnostic diagrams for
    positive-support reliability data, built on Mellin log-cumulants.

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: Getting started
        href: articles/getting-started.html
      - text: The three diagnostic diagrams
        href: articles/diagrams.html
      - text: Goodness-of-fit tests and the bootstrap
        href: articles/gof-tests.html
      - text: Simulation studies
        href: articles/simulation.html

